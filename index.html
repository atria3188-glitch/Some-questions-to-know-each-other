<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Getting to Know Each Other</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#333
}

.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 4px 15px #ddd
}

h1{
  text-align:center;
  color:#444
}

h2{
  color:#555
}

input,textarea,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  font-size:16px
}

input,textarea{
  border:1px solid #ddd
}

textarea{
  height:140px;
  resize:none
}

button{
  border:0;
  background:#555;
  color:white;
  font-weight:bold
}

.secondary{
  background:#eee;
  color:#555
}

.hidden{
  display:none
}

.progress{
  color:#999;
  font-size:14px
}

.card{
  background:#f7f7f7;
  padding:15px;
  margin:12px 0;
  border-radius:10px
}
</style>
</head>

<body>

<div class="box">

<!-- START -->
<div id="start">

<h1>Getting to Know Each Other</h1>

<p>
Answer the questions honestly and take your time.
</p>

<input id="name" placeholder="Your name">

<button onclick="start()">Start</button>

</div>


<!-- QUESTIONS -->
<div id="quiz" class="hidden">

<h1 id="section"></h1>

<p class="progress" id="progress"></p>

<h2 id="question"></h2>

<textarea id="answer"
placeholder="Your answer..."></textarea>

<button onclick="next()">Next</button>

</div>


<!-- FINISH -->
<div id="finish" class="hidden">

<h1>You're Done</h1>

<p>
Your answers are saved on this device.
</p>

<p>
Copy your answer code and send it to the other person.
</p>

<textarea id="myCode" readonly></textarea>

<button onclick="copyCode()">
Copy My Answers
</button>

<hr>

<h2>Reveal Answers</h2>

<textarea id="otherCode"
placeholder="Paste their answer code here..."></textarea>

<button onclick="reveal()">
Reveal Our Answers
</button>

</div>


<!-- RESULTS -->
<div id="results" class="hidden">

<h1>Our Answers</h1>

<div id="resultList"></div>

<button class="secondary" onclick="location.reload()">
Start Again
</button>

</div>

</div>


<script>

const questions=[

["About Each Other","How would you describe yourself?"],
["About Each Other","What are your biggest strengths and weaknesses?"],
["About Each Other","What do people often misunderstand about you?"],
["About Each Other","What usually stresses you out?"],
["About Each Other","What do you do when you're in a bad mood?"],
["About Each Other","When you're upset, do you prefer to talk about it or deal with it yourself?"],
["About Each Other","How much alone time do you usually need?"],
["About Each Other","What makes you feel genuinely cared for?"],

["Family & Personal Life","What's your relationship with your family like?"],
["Family & Personal Life","Who do you usually go to when you have a problem?"],
["Family & Personal Life","Is there an experience that shaped who you are today?"],

["Love & Relationships","What kind of relationship are you looking for?"],
["Love & Relationships","What does being in love mean to you?"],
["Love & Relationships","What do you value most in a relationship?"],
["Love & Relationships","What makes a relationship healthy to you?"],
["Love & Relationships","How do you want to be loved and cared for?"],
["Love & Relationships","What do you need from your partner to feel secure?"],
["Love & Relationships","How often would you like to see each other?"],
["Love & Relationships","Should couples still have their own lives and personal space?"],
["Love & Relationships","What are healthy boundaries with the opposite sex?"],
["Love & Relationships","What does commitment mean to you?"],
["Love & Relationships","How do you show someone that you're serious about them?"],
["Love & Relationships","Would you be comfortable making the relationship public?"],

["Communication & Conflict","When you're upset or have an argument, how do you usually deal with it?"],
["Communication & Conflict","When you're angry, do you prefer to solve things immediately or take some time first?"],
["Communication & Conflict","What is something you absolutely cannot tolerate in a relationship?"],
["Communication & Conflict","When there's a problem between us, are you willing to work through it together?"],
["Communication & Conflict","What would make you slowly lose feelings for someone?"],

["About Us","What do you think is our biggest difference?"],
["About Us","What do you think we need to work on if we want this relationship to work?"],
["About Us","Is there anything about me or this relationship that makes you feel unsure or afraid?"],
["About Us","What's something about yourself you want me to understand better?"],
["About Us","What do you enjoy most about being with me?"],
["About Us","What do you hope we can experience or build together in the future?"]

];

let i=0;
let answers=[];
let myName="";


function start(){

myName=document.getElementById("name").value.trim();

if(!myName){
alert("Please enter your name.");
return;
}

document.getElementById("start").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");

showQuestion();

}


function showQuestion(){

document.getElementById("section").innerText=
questions[i][0];

document.getElementById("progress").innerText=
`${i+1} / ${questions.length}`;

document.getElementById("question").innerText=
questions[i][1];

document.getElementById("answer").value=
answers[i]||"";

}


function next(){

let a=document.getElementById("answer").value.trim();

if(!a){
alert("Please answer first.");
return;
}

answers[i]=a;

if(i<questions.length-1){

i++;
showQuestion();

}else{

finish();

}

}


function finish(){

document.getElementById("quiz").classList.add("hidden");
document.getElementById("finish").classList.remove("hidden");

let data={
name:myName,
answers:answers
};

let code=btoa(
unescape(
encodeURIComponent(
JSON.stringify(data)
)
)
);

document.getElementById("myCode").value=code;

}


function copyCode(){

let box=document.getElementById("myCode");

box.select();

navigator.clipboard.writeText(box.value);

alert("Copied. Send this code to the other person.");

}


function reveal(){

let code=document.getElementById("otherCode").value.trim();

if(!code){
alert("Paste their answer code first.");
return;
}

try{

let other=JSON.parse(
decodeURIComponent(
escape(
atob(code)
)
)
);

document.getElementById("finish").classList.add("hidden");
document.getElementById("results").classList.remove("hidden");

let html="";

for(let x=0;x<questions.length;x++){

html+=`

<div class="card">

<b>${x+1}. ${questions[x][1]}</b>

<p>
<strong>${myName}</strong><br>
${answers[x]||"-"}
</p>

<p>
<strong>${other.name}</strong><br>
${other.answers[x]||"-"}
</p>

</div>

`;

}

document.getElementById("resultList").innerHTML=html;

}catch(e){

alert("The answer code is invalid. Please copy it again.");

}

}

</script>

</body>
</html>
