<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Getting to Know Each Other</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#f5f0ff,#eaf6ff);
 color:#222;
}

.container{
 max-width:700px;
 margin:auto;
 padding:20px 15px;
}

.card{
 background:white;
 border-radius:20px;
 padding:24px;
 box-shadow:0 8px 30px #0001;
 margin-bottom:18px;
}

h1{
 text-align:center;
 font-size:28px;
 margin:5px 0 8px;
}

.subtitle{
 text-align:center;
 color:#777;
 margin-bottom:25px;
}

.section{
 font-size:13px;
 color:#777;
 text-transform:uppercase;
 letter-spacing:1px;
 margin-bottom:10px;
}

.progress{
 font-size:13px;
 color:#888;
 margin-bottom:12px;
}

.question{
 font-size:21px;
 font-weight:bold;
 line-height:1.4;
}

.guide{
 margin-top:14px;
 padding:14px;
 background:#f5f5f7;
 border-radius:12px;
 color:#666;
 font-size:14px;
 line-height:1.5;
}

.guide b{
 color:#333;
}

textarea,
input{
 width:100%;
 padding:13px;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:15px;
 margin-top:10px;
 font-family:Arial,sans-serif;
}

textarea{
 min-height:130px;
 resize:vertical;
}

button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#333;
 color:white;
 font-size:15px;
 margin-top:10px;
}

button:active{
 opacity:.8;
}

.secondary{
 background:#eee;
 color:#222;
}

.hidden{
 display:none;
}

.answer{
 background:#f6f6f6;
 padding:13px;
 border-radius:10px;
 white-space:pre-wrap;
 line-height:1.5;
 margin-bottom:20px;
}

.divider{
 border:0;
 border-top:1px solid #ddd;
 margin:25px 0;
}

.small{
 color:#777;
 font-size:14px;
 line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

<!-- START -->
<div id="setup" class="card">

<h1>Getting to Know Each Other</h1>

<p class="subtitle">
34 questions to understand each other better
</p>

<label><b>Your name</b></label>

<input
 id="name"
 type="text"
 placeholder="Enter your name"
>

<button onclick="startQuiz()">Start</button>

</div>


<!-- QUESTIONS -->
<div id="quiz" class="card hidden">

<div class="progress" id="progress"></div>

<div class="section" id="section"></div>

<div class="question" id="question"></div>

<div class="guide">
<b>Guide:</b>
<span id="guide"></span>
</div>

<textarea
 id="answer"
 placeholder="Write your answer here..."
></textarea>

<button onclick="nextQuestion()">Next</button>

</div>


<!-- FINISHED -->
<div id="finished" class="card hidden">

<h2>You're finished</h2>

<p class="small">
Your answers are stored on this phone. Copy your answer code and send it to the other person.
</p>

<label><b>Your Answer Code</b></label>

<textarea id="myCode" readonly></textarea>

<button onclick="copyCode()">
Copy My Answer Code
</button>

<hr class="divider">

<h2>Reveal Their Answers</h2>

<p class="small">
Ask the other person to send you their answer code, then paste it below.
</p>

<textarea
 id="otherCode"
 placeholder="Paste their answer code here..."
></textarea>

<button onclick="revealAnswers()">
Reveal Answers
</button>

</div>


<!-- RESULTS -->
<div id="results" class="card hidden">

<h2 id="resultTitle"></h2>

<div id="resultContent"></div>

</div>

</div>


<script>

const questions = [

/* 1 */
[
"About Each Other",
"How would you describe yourself?",
"Your personality, how you behave around people, and what kind of person you think you are."
],

/* 2 */
[
"About Each Other",
"What are your biggest strengths and weaknesses?",
"What you’re good at, what you struggle with, and what you’re trying to improve."
],

/* 3 */
[
"About Each Other",
"What do people often misunderstand about you?",
"Something people assume about you that isn’t actually true."
],

/* 4 */
[
"About Each Other",
"What usually stresses you out?",
"Work, relationships, money, family, uncertainty, pressure, etc."
],

/* 5 */
[
"About Each Other",
"What do you do when you’re in a bad mood?",
"Do you want to be alone, talk to someone, sleep, go out, or distract yourself?"
],

/* 6 */
[
"About Each Other",
"When you’re upset, do you prefer to talk about it or deal with it yourself?",
"Do you want to talk immediately, or do you need time before talking?"
],

/* 7 */
[
"About Each Other",
"How much alone time do you usually need?",
"How much personal time you need even when you’re in a relationship."
],

/* 8 */
[
"About Each Other",
"What makes you feel genuinely cared for?",
"Actions, words, time, checking in, physical affection, remembering small things, etc."
],

/* 9 */
[
"Family & Personal Life",
"What’s your relationship with your family like?",
"How close you are, how often you interact, and how important family is to you."
],

/* 10 */
[
"Family & Personal Life",
"Who do you usually go to when you have a problem?",
"Who you trust and feel comfortable talking to."
],

/* 11 */
[
"Family & Personal Life",
"Is there an experience that shaped who you are today?",
"An important experience that changed how you think or behave."
],

/* 12 */
[
"Love & Relationships",
"What kind of relationship are you looking for?",
"Casual, serious, long-term, marriage-minded, or just seeing where things go."
],

/* 13 */
[
"Love & Relationships",
"What does being in love mean to you?",
"What love means beyond just having feelings for someone."
],

/* 14 */
[
"Love & Relationships",
"What do you value most in a relationship?",
"Trust, loyalty, communication, effort, respect, honesty, security, etc."
],

/* 15 */
[
"Love & Relationships",
"What makes a relationship healthy to you?",
"How you think couples should communicate, respect each other, handle problems, and maintain their own lives."
],

/* 16 */
[
"Love & Relationships",
"How do you want to be loved and cared for?",
"What makes you personally feel loved."
],

/* 17 */
[
"Love & Relationships",
"What do you need from your partner to feel secure?",
"Reassurance, consistency, communication, honesty, quality time, etc."
],

/* 18 */
[
"Love & Relationships",
"How often would you like to see each other?",
"Your ideal frequency and what happens when one person is busy."
],

/* 19 */
[
"Love & Relationships",
"Should couples still have their own lives and personal space?",
"Your thoughts about friends, hobbies, alone time, privacy, and independence."
],

/* 20 */
[
"Love & Relationships",
"What are healthy boundaries with the opposite sex?",
"What you’re comfortable or uncomfortable with when your partner interacts with other people."
],

/* 21 */
[
"Love & Relationships",
"What does commitment mean to you?",
"Being exclusive, being loyal, making an effort, planning a future, staying through difficult times, etc."
],

/* 22 */
[
"Love & Relationships",
"How do you show someone that you’re serious about them?",
"Actions you would take when you genuinely want a relationship with someone."
],

/* 23 */
[
"Love & Relationships",
"Would you be comfortable making the relationship public?",
"Whether you’re comfortable telling friends/family or posting about the relationship."
],

/* 24 */
[
"Communication & Conflict",
"When you’re upset or have an argument, how do you usually deal with it?",
"Do you talk immediately, become quiet, need space, or want reassurance?"
],

/* 25 */
[
"Communication & Conflict",
"When you’re angry, do you prefer to solve things immediately or take some time first?",
"What you need during an argument and how long you normally need to calm down."
],

/* 26 */
[
"Communication & Conflict",
"What is something you absolutely cannot tolerate in a relationship?",
"Behaviours that would cross a serious line for you."
],

/* 27 */
[
"Communication & Conflict",
"When there’s a problem between us, are you willing to work through it together?",
"Whether you’re willing to communicate, compromise, understand each other, and find a solution."
],

/* 28 */
[
"Communication & Conflict",
"What would make you slowly lose feelings for someone?",
"Things that would gradually make you feel disconnected from your partner."
],

/* 29 */
[
"About Us",
"What do you think is our biggest difference?",
"Personality, communication, lifestyle, expectations, emotional needs, etc."
],

/* 30 */
[
"About Us",
"What do you think we need to work on if we want this relationship to work?",
"Something you think both of you could improve together."
],

/* 31 */
[
"About Us",
"Is there anything about me or this relationship that makes you feel unsure or afraid?",
"Any worries, fears, doubts, or things you’re still trying to understand."
],

/* 32 */
[
"About Us",
"What’s something about yourself you want me to understand better?",
"Something important about you that you feel the other person may not fully understand yet."
],

/* 33 */
[
"About Us",
"What do you enjoy most about being with me?",
"What you genuinely like about your connection and time together."
],

/* 34 */
[
"About Us",
"What do you hope we can experience or build together in the future?",
"Experiences, goals, lifestyle, relationship milestones, or what you hope the relationship becomes."
]

];


let current = 0;
let answers = [];
let myName = "";


function startQuiz(){

 myName =
 document.getElementById("name").value.trim();

 if(!myName){
  alert("Please enter your name.");
  return;
 }

 document
 .getElementById("setup")
 .classList.add("hidden");

 document
 .getElementById("quiz")
 .classList.remove("hidden");

 showQuestion();
}


function showQuestion(){

 const q = questions[current];

 document.getElementById("progress").textContent =
 "Question " + (current + 1) +
 " of " + questions.length;

 document.getElementById("section").textContent =
 q[0];

 document.getElementById("question").textContent =
 q[1];

 document.getElementById("guide").textContent =
 q[2];

 document.getElementById("answer").value =
 answers[current] || "";
}


function nextQuestion(){

 const answer =
 document.getElementById("answer")
 .value
 .trim();

 if(!answer){
  alert("Please answer this question.");
  return;
 }

 answers[current] = answer;

 current++;

 if(current < questions.length){
  showQuestion();
 }else{
  finishQuiz();
 }
}


/* Convert answers into a code */
function encodeAnswers(data){

 return btoa(
  unescape(
   encodeURIComponent(
    JSON.stringify(data)
   )
  )
 );

}


/* Convert code back into answers */
function decodeAnswers(code){

 return JSON.parse(
  decodeURIComponent(
   escape(
    atob(code.trim())
   )
  )
 );

}


function finishQuiz(){

 document
 .getElementById("quiz")
 .classList.add("hidden");

 document
 .getElementById("finished")
 .classList.remove("hidden");

 const data = {
  name: myName,
  answers: answers
 };

 document.getElementById("myCode").value =
 encodeAnswers(data);

}


function copyCode(){

 const code =
 document.getElementById("myCode").value;

 navigator.clipboard
 .writeText(code)
 .then(function(){
  alert("Answer code copied.");
 })
 .catch(function(){
  alert("Please copy the code manually.");
 });

}


function revealAnswers(){

 try{

  const code =
  document.getElementById("otherCode")
  .value
  .trim();

  const other =
  decodeAnswers(code);

  if(
   !other.name ||
   !other.answers ||
   other.answers.length !== questions.length
  ){
   throw new Error();
  }

  document
  .getElementById("results")
  .classList.remove("hidden");

  document.getElementById("resultTitle").textContent =
  myName + " & " + other.name;

  let html = "";

  questions.forEach(function(q,index){

   html +=

   '<div class="section">' +
   (index + 1) + ". " + q[0] +
   '</div>' +

   '<p><b>' +
   escapeHTML(q[1]) +
   '</b></p>' +

   '<p><b>' +
   escapeHTML(myName) +
   '</b></p>' +

   '<div class="answer">' +
   escapeHTML(answers[index]) +
   '</div>' +

   '<p><b>' +
   escapeHTML(other.name) +
   '</b></p>' +

   '<div class="answer">' +
   escapeHTML(other.answers[index]) +
   '</div>';

  });

  document.getElementById("resultContent").innerHTML =
  html;

  document
  .getElementById("results")
  .scrollIntoView({
   behavior:"smooth"
  });

 }

 catch(error){

  alert(
   "The answer code is not valid. Please copy and paste the complete code again."
  );

 }

}


function escapeHTML(text){

 return text.replace(
  /[&<>"']/g,
  function(char){

   const map = {
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
   };

   return map[char];

  }
 );

}

</script>

</body>
</html>
