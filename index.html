<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Getting to Know Each Other</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f7f5f2;
  margin:0;
  padding:20px;
  color:#333;
}
.box{
  max-width:650px;
  margin:auto;
  background:white;
  padding:22px;
  border-radius:18px;
}
h1{
  text-align:center;
  font-size:25px;
}
h2{
  font-size:19px;
  margin-top:28px;
}
.q{
  margin:18px 0;
}
.note{
  text-align:center;
  color:#777;
  font-size:14px;
}
textarea{
  width:100%;
  box-sizing:border-box;
  min-height:85px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:12px;
  background:#333;
  color:white;
  font-size:16px;
}
.answer2{
  display:none;
  background:#f3f1ee;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}
</style>
</head>
<body>
<div class="box">
<h1>Getting to Know Each Other</h1>
<p class="note">
Answer honestly. Submit when you're done, then reveal the answers together.
</p>
<label>Your name:</label>
<input id="name" placeholder="Enter your name">
<div id="questions"></div>
<button onclick="submitAnswers()">Submit My Answers</button>
<button onclick="reveal()">Reveal Answers</button>
<p id="status" class="note"></p>
</div>
<script>
const qs=[
["About Each Other",[
["How would you describe yourself?","Your personality, how you behave around people, and what kind of person you think you are."],
["What are your biggest strengths and weaknesses?","What you're good at, what you struggle with, and what you're trying to improve."],
["What do people often misunderstand about you?","Something people assume about you that isn't actually true."],
["What usually stresses you out?","Work, relationships, money, family, uncertainty, pressure, etc."],
["What do you do when you're in a bad mood?","Do you want to be alone, talk to someone, sleep, go out, or distract yourself?"],
["When you're upset, do you prefer to talk about it or deal with it yourself?","Do you want to talk immediately, or do you need time before talking?"],
["How much alone time do you usually need?","How much personal time you need even when you're in a relationship."],
["What makes you feel genuinely cared for?","Actions, words, time, checking in, physical affection, remembering small things, etc."]
]],
["Family & Personal Life",[
["What's your relationship with your family like?","How close you are, how often you interact, and how important family is to you."],
["Who do you usually go to when you have a problem?","Who you trust and feel comfortable talking to."],
["Is there an experience that shaped who you are today?","An important experience that changed how you think or behave."]
]],
["Relationships",[
["What kind of relationship are you looking for?","Casual, serious, long-term, marriage-minded, or just seeing where things go."],
["What does being in a relationship mean to you?","What being with someone means to you beyond simply having feelings."],
["What do you value most in a relationship?","Trust, loyalty, communication, effort, respect, honesty, security, etc."],
["What makes a relationship healthy to you?","How you think couples should communicate, respect each other, handle problems, and maintain their own lives."],
["How do you want to be treated by your partner?","What makes you feel respected, appreciated, and cared for."],
["What do you need from your partner to feel secure?","Reassurance, consistency, communication, honesty, quality time, etc."],
["How often would you like to see each other?","Your ideal frequency and what happens when one person is busy."],
["Should couples still have their own lives and personal space?","Your thoughts about friends, hobbies, alone time, privacy, and independence."],
["What are healthy boundaries with the opposite sex?","What you're comfortable or uncomfortable with when your partner interacts with other people."],
["What does commitment mean to you?","Being exclusive, being loyal, making an effort, planning a future, staying through difficult times, etc."],
["How do you show someone that you're serious about them?","Actions you would take when you genuinely want a relationship with someone."],
["Would you be comfortable making the relationship public?","Whether you're comfortable telling friends and family or posting about the relationship."]
]],
["Communication & Conflict",[
["When you're upset or have an argument, how do you usually deal with it?","Do you talk immediately, become quiet, need space, or want reassurance?"],
["When you're angry, do you prefer to solve things immediately or take some time first?","What you need during an argument and how long you normally need to calm down."],
["What is something you absolutely cannot tolerate in a relationship?","Behaviours that would cross a serious line for you."],
["When there's a problem between us, are you willing to work through it together?","Whether you're willing to communicate, compromise, understand each other, and find a solution."],
["What would make you slowly lose feelings for someone?","Things that would gradually make you feel disconnected from your partner."],
["After an argument, what helps you feel ready to reconnect and move forward?","An apology, explanation, affection, time, changed behaviour, or something else."]
]],
["Money & Future",[
["How do you usually think about money and spending in a relationship?","Saving vs spending, splitting bills, treating each other, financial independence, etc."],
["What are some things you want to achieve or experience in your own life?","Career, travel, family, lifestyle, personal goals, or things you want to experience."],
["How do you feel about marriage and having children in the future?","Whether you want them, don't want them, or aren't sure yet."]
]],
["About Us",[
["What do you think is our biggest difference?","Personality, communication, lifestyle, expectations, emotional needs, etc."],
["What do you think we need to work on if we want this relationship to work?","Something you think both of you could improve together."],
["Is there anything about me or this relationship that makes you feel unsure or afraid?","Any worries, fears, doubts, or things you're still trying to understand."],
["What's something about yourself you want me to understand better?","Something important about you that you feel the other person may not fully understand yet."],
["What do you enjoy most about being with me?","What you genuinely like about your connection and time together."],
["What do you hope we can experience or build together in the future?","Experiences, goals, lifestyle, relationship milestones, or what you hope the relationship becomes."]
]]
];
let n=0;
let html="";
qs.forEach(section=>{
  html+="<h2>"+section[0]+"</h2>";
  section[1].forEach(q=>{
    n++;
    html+=`
    <div class="q">
      <b>${n}. ${q[0]}</b>
      <p class="note">${q[1]}</p>
      <textarea id="q${n}" placeholder="Your answer..."></textarea>
      <div class="answer2" id="a${n}"></div>
    </div>
    `;
  });
});
document.getElementById("questions").innerHTML=html;
function submitAnswers(){
  let data={
    name:document.getElementById("name").value
  };
  for(let i=1;i<=37;i++){
    data["q"+i]=document.getElementById("q"+i).value;
  }
  localStorage.setItem(
    "answers",
    JSON.stringify(data)
  );
  document.getElementById("status").innerText=
  "Your answers are saved on this phone.";
}
function reveal(){
  let data=JSON.parse(
    localStorage.getItem("answers")
  );
  if(!data){
    document.getElementById("status").innerText=
    "No saved answers found on this phone.";
    return;
  }
  for(let i=1;i<=37;i++){
    document.getElementById("a"+i).style.display="block";
    document.getElementById("a"+i).innerHTML=
    "<b>"+(data.name||"Their")+
    "'s answer:</b><br>"+
    (data["q"+i]||"(No answer)");
  }
  document.getElementById("status").innerText=
  "Answers revealed.";
}
</script>
</body>
</html>
